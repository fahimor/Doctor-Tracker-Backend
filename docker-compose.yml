# Optional: a local MongoDB for development (if you don't want to use Atlas or `npm run dev:memory`).
#   docker compose up -d
# then in backend/.env:  MONGODB_URI=mongodb://127.0.0.1:27017/doctor-tracker
services:
  mongo:
    image: mongo:8
    container_name: doctor-tracker-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
